<!DOCTYPE html>
<html>
<head>
    <title>Minimal GIS Test</title>
    <!-- Google Identity Services Client Library -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style> body { padding: 20px; } </style>
</head>
<body>
    <h1>Minimal GIS Test Page</h1>
    <p>Client ID: {{ g.google_client_id }}</p> {# Display it to confirm #}

    <div id="g_id_onload"
         data-client_id="{{ g.google_client_id }}"
         data-context="signin"
         data-ux_mode="popup"
         data-callback="handleCredentialResponseMinimal"
         data-auto_prompt="false">
    </div>

    <div class="g_id_signin"
         data-type="standard"
         data-shape="rectangular"
         data-theme="outline"
         data-text="signin_with"
         data-size="large"
         data-logo_alignment="left">
    </div>

    <p>Status: <span id="status">Waiting...</span></p>

    {# Hidden form for submission #}
    <form id="google-auth-form-minimal" action="{{ url_for('auth_google') }}" method="post" style="display: none;">
        <input type="hidden" name="id_token" id="id_token_field_minimal">
    </form>

    <script type="text/javascript">
        function handleCredentialResponseMinimal(credentialResponse) {
          console.log("MINIMAL GIS Callback executed.");
          document.getElementById('status').innerText = 'Callback executed!';
          const id_token = credentialResponse.credential;
          console.log("MINIMAL ID Token retrieved (first few chars): " + id_token.substring(0, 20));
          document.getElementById('id_token_field_minimal').value = id_token;
          // DON'T submit automatically for this test, just log
          // document.getElementById('google-auth-form-minimal').submit();
          document.getElementById('status').innerText = 'Token received, form ready (not submitting).';
        }
    </script>
</body>
</html>
